<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Everything About Virat Kohli | Futuristic Tribute</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A futuristic animated tribute website about Indian cricketer Virat Kohli – stats, career, family, photos, and more."
  />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #020617;
      --bg-soft: #020617ee;
      --glass: rgba(15, 23, 42, 0.9);
      --accent: #22d3ee;
      --accent-2: #22c55e;
      --accent-3: #f97316;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border-soft: rgba(148, 163, 184, 0.35);
      --radius-xl: 24px;
      --shadow-strong: 0 24px 80px rgba(15, 23, 42, 0.9);
      --transition-fast: 200ms ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background orbits / particles */
    .bg-orbit,
    .bg-orbit-2 {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at 80% 0%, rgba(251, 191, 36, 0.18), transparent 55%),
        radial-gradient(circle at 50% 120%, rgba(52, 211, 153, 0.15), transparent 55%);
      mix-blend-mode: screen;
      animation: bgPulse 18s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
      }
      100% {
        transform: scale(1.06) translateY(-8px);
        opacity: 0.8;
      }
    }

    .bg-grid-overlay {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(
          rgba(148, 163, 184, 0.03) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(148, 163, 184, 0.03) 1px,
          transparent 1px
        );
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at top, black 0, transparent 70%);
      opacity: 0.9;
      pointer-events: none;
      z-index: -1;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 16px 80px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: linear-gradient(
        90deg,
        rgba(15, 23, 42, 0.95),
        rgba(15, 23, 42, 0.7),
        rgba(15, 23, 42, 0.95)
      );
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.8);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.6);
      background: radial-gradient(circle at 30% 0, #22d3ee 0, #0f172a 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.65);
      transform: translateZ(0);
      animation: spinGlow 14s linear infinite;
    }

    @keyframes spinGlow {
      0% {
        box-shadow: 0 0 28px rgba(56, 189, 248, 0.5);
        transform: rotate(0deg);
      }
      50% {
        box-shadow: 0 0 40px rgba(52, 211, 153, 0.65);
      }
      100% {
        box-shadow: 0 0 28px rgba(56, 189, 248, 0.5);
        transform: rotate(360deg);
      }
    }

    .brand-logo span {
      font-family: "Orbitron", system-ui;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-family: "Orbitron", system-ui;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .brand-sub {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    nav ul {
      display: flex;
      gap: 12px;
      list-style: none;
      align-items: center;
    }

    nav a {
      position: relative;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
      transition: all var(--transition-fast);
      overflow: hidden;
    }

    nav a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #22d3ee, #22c55e, #eab308);
      opacity: 0;
      transition: opacity var(--transition-fast);
      z-index: -1;
    }

    nav a:hover {
      color: #0b1120;
      transform: translateY(-1px);
    }

    nav a:hover::before {
      opacity: 1;
    }

    .nav-pill {
      font-size: 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 6px 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      background: radial-gradient(circle at top left, #0ea5e9 0, #020617 50%);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.5);
    }

    .nav-pill span {
      font-family: "Orbitron", system-ui;
      font-size: 0.75rem;
    }

    .nav-toggle {
      display: none;
      width: 32px;
      height: 32px;
      position: relative;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      align-items: center;
      justify-content: center;
    }

    .nav-toggle span,
    .nav-toggle span::before,
    .nav-toggle span::after {
      content: "";
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: #e5e7eb;
      position: absolute;
      transition: 0.2s ease;
    }

    .nav-toggle span::before {
      transform: translateY(-5px);
    }

    .nav-toggle span::after {
      transform: translateY(5px);
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.6fr);
      gap: 32px;
      align-items: center;
      padding: 32px 0 40px;
    }

    .hero-badge-row {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .pill {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at center, #22c55e, #166534);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }

    .hero-title {
      font-family: "Orbitron", system-ui;
      font-size: clamp(2.1rem, 3vw, 3rem);
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .hero-title span.highlight {
      background-image: linear-gradient(120deg, #22d3ee, #22c55e, #facc15);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 540px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .btn {
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      text-decoration: none;
      color: #e5e7eb;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
      transition: all var(--transition-fast);
      backdrop-filter: blur(10px);
    }

    .btn-primary {
      border: none;
      background: linear-gradient(135deg, #22d3ee, #22c55e, #eab308);
      color: #020617;
      font-weight: 600;
      box-shadow: 0 14px 35px rgba(34, 211, 238, 0.45);
    }

    .btn-primary:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 18px 40px rgba(34, 211, 238, 0.7);
    }

    .btn-outline {
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.9);
    }

    .btn-outline:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.9);
      color: #e5e7eb;
    }

    .hero-meta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hero-meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22d3ee;
    }

    /* HERO RIGHT – 3D CARD */
    .hero-right {
      position: relative;
      perspective: 1200px;
    }

    .player-card {
      position: relative;
      border-radius: 30px;
      padding: 18px 18px 20px;
      background: radial-gradient(circle at top left, #22d3ee33 0, #020617 45%);
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateY(-10deg) rotateX(4deg);
      animation: cardFloat 10s ease-in-out infinite alternate;
    }

    @keyframes cardFloat {
      0% {
        transform: rotateY(-10deg) rotateX(4deg) translateY(0);
      }
      50% {
        transform: rotateY(-5deg) rotateX(3deg) translateY(-5px);
      }
      100% {
        transform: rotateY(-12deg) rotateX(6deg) translateY(0);
      }
    }

    .player-card-orbit {
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.18), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.18), transparent 60%);
      opacity: 0.9;
      filter: blur(6px);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .player-meta {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      z-index: 1;
    }

    .player-meta-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-name {
      font-family: "Orbitron", system-ui;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .player-role {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .player-tag {
      font-size: 0.7rem;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.75);
      background: rgba(15, 23, 42, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .player-photo-wrap {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: radial-gradient(circle at top, #1e293b 0, #020617 60%);
      height: 260px;
    }

    .player-photo {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.1),
          rgba(15, 23, 42, 0.95)
        ),
        url("https://images.assettype.com/freepressjournal/2024-11/7ee77a61-8f6c-4a2d-9f7a-36bcf0403add/Virat_Kohli_2.jpg?w=1200")
          center top / cover no-repeat;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
    }

    .player-stats-strip {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
      z-index: 1;
    }

    .player-stat {
      border-radius: 15px;
      padding: 7px 10px;
      background: radial-gradient(circle at top, #0f172a, #020617);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-stat-label {
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .player-stat-value {
      font-family: "Orbitron", system-ui;
      font-size: 0.9rem;
    }

    .player-footnote {
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* SECTION WRAPPER / PANEL */
    section {
      margin-top: 40px;
    }

    .panel {
      border-radius: var(--radius-xl);
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      padding: 18px 16px 20px;
      box-shadow: var(--shadow-strong);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -60%;
      opacity: 0.08;
      background:
        radial-gradient(circle at 0 0, #22d3ee, transparent 60%),
        radial-gradient(circle at 100% 100%, #22c55e, transparent 60%);
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .panel-title {
      font-family: "Orbitron", system-ui;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title-pill {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at center, #22d3ee, #0ea5e9);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.9);
    }

    .panel-subtitle {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .pill-outline {
      font-size: 0.68rem;
      border-radius: 999px;
      border: 1px dashed rgba(148, 163, 184, 0.65);
      padding: 4px 9px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    /* ABOUT / QUICK GRID */
    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 2fr);
      gap: 18px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .about-text p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .chip {
      font-size: 0.7rem;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.85);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.62rem;
    }

    .chip-value {
      font-size: 0.8rem;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .mini-stat {
      border-radius: 16px;
      padding: 9px 10px;
      background: radial-gradient(circle at top, #0b1120, #020617);
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mini-stat-label {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      font-size: 0.6rem;
    }

    .mini-stat-value {
      font-family: "Orbitron", system-ui;
      font-size: 0.95rem;
    }

    .mini-stat-meta {
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* CAREER STATS SECTION */
    .stats-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .format-card {
      border-radius: 18px;
      padding: 10px 10px 11px;
      background: radial-gradient(circle at top, #020617, #020617);
      border: 1px solid rgba(148, 163, 184, 0.55);
      position: relative;
      overflow: hidden;
      font-size: 0.8rem;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }

    .format-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      opacity: 0;
      background:
        conic-gradient(
          from 0deg,
          #22d3ee,
          #22c55e,
          #eab308,
          #22d3ee
        );
      animation: spinBorder 14s linear infinite;
      mix-blend-mode: screen;
      transition: opacity 200ms ease;
    }

    @keyframes spinBorder {
      to {
        transform: rotate(360deg);
      }
    }

    .format-card-inner {
      position: relative;
      z-index: 1;
    }

    .format-name {
      font-family: "Orbitron", system-ui;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .format-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .format-main-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .format-main-number {
      font-family: "Orbitron", system-ui;
      font-size: 1.1rem;
    }

    .format-main-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .format-sub-row {
      display: flex;
      gap: 6px;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .format-sub-row span strong {
      color: #e5e7eb;
      font-weight: 500;
    }

    .format-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.9);
      border-color: rgba(56, 189, 248, 0.8);
    }

    .format-card:hover::before {
      opacity: 0.16;
    }

    /* GALLERY SLIDER */
    .gallery-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr);
      gap: 20px;
      align-items: stretch;
    }

    .slider {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.65);
      background: radial-gradient(circle at top, #020617, #020617);
    }

    .slider-track {
      display: flex;
      transition: transform 500ms ease-in-out;
    }

    .slide {
      min-width: 100%;
      position: relative;
      height: 260px;
      overflow: hidden;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.05);
      transition: transform 400ms ease-out;
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(15, 23, 42, 0.15),
        rgba(15, 23, 42, 0.9)
      );
    }

    .slide-caption {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      z-index: 2;
      display: flex;
      justify-content:
